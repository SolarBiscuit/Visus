plugins {
	id 'com.github.johnrengelman.shadow' version '8.1.1'
	id 'dev.architectury.loom' version '1.4-SNAPSHOT'
	id 'maven-publish'
}

loom {
	silentMojangMappingsLicense()
	accessWidenerPath = file("src/main/resources/iris.accesswidener")

	forge {
		convertAccessWideners = true
		mixinConfigs = [
				"mixins.oculus.json",
				"mixins.oculus.fantastic.json",
				"mixins.oculus.vertexformat.json",
				"mixins.oculus.bettermipmaps.json",
				"mixins.oculus.fixes.maxfpscrash.json",
				"oculus-batched-entity-rendering.mixins.json",
				"mixins.oculus.compat.sodium.json",
				"mixins.oculus.compat.indigo.json",
				"mixins.oculus.compat.indium.json",
				"mixins.oculus.compat.dh.json",
				"mixins.oculus.compat.pixelmon.json",
				"mixins.visus.compat.geckolib.json",
				"mixins.visus.json",
				"mixins.visus.flywheel.json",
				"mixins.visus.flywheel.iris.json",
				"mixins.visus.flywheel.forge.json"
		]
	}
	mixin.defaultRefmapName = "oculus-mixins-refmap.json"
}

configurations {
	shadow {
		transitive = false
	}
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = "${project.archives_base_name}-${project.minecraft_version}"
version = project.mod_version
group = project.maven_group

sourceSets {
	desktop {
	}

	vendored {
		java {
			compileClasspath += main.compileClasspath
		}
	}

	sodiumCompatibility {
		java {
			compileClasspath += main.compileClasspath
			compileClasspath += main.output
		}
	}

	main {
		java {
			compileClasspath += vendored.output
			runtimeClasspath += vendored.output
		}
	}

	// T0 unit tests (docs/VISUS-ROADMAP.md, "Test tiers"). They exercise pure code only: no GL context, no game.
	test {
		java {
			compileClasspath += main.output + vendored.output
			runtimeClasspath += main.output + vendored.output
		}
	}
}

loom {
	runs {
		client {
			mods {
				oculus {
					sourceSet sourceSets.desktop
					sourceSet sourceSets.main
					sourceSet sourceSets.vendored
					sourceSet sourceSets.sodiumCompatibility
				}
			}
		}
	}
}

repositories {
	maven {
		name = "CurseForge"
		url = "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		url "https://maven.blamejared.com/"
	}
	maven {
		url "https://maven.neoforged.net/releases"
	}
	maven {
		// Flywheel (Visus's native Flywheel backend, absorbed from irisflw)
		name = "createmod"
		url "https://maven.createmod.net/"
		content {
			includeGroup "dev.engine-room.flywheel"
		}
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	forge "net.neoforged:forge:${minecraft_version}-${forge_version}"

	modImplementation "org.embeddedt:embeddium-${minecraft_version}:${embeddium_version}"
	modCompileOnly("maven.modrinth:distanthorizonsapi:3.0.0")
	// Optional at runtime: the Flywheel backend only loads when Flywheel is installed (Vanillin, Create 6).
	modCompileOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")

	forgeRuntimeLibrary(implementation(shadow(project(path: ":glsl-relocated", configuration: "bundledJar")))) {
		transitive = false
	}
	forgeRuntimeLibrary(implementation(include("org.anarres:jcpp:1.4.14")))

	testImplementation(platform("org.junit:junit-bom:5.10.2"))
	testImplementation("org.junit.jupiter:junit-jupiter")
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "oculus_alias_version", project.oculus_alias_version

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version, "oculus_alias_version": project.oculus_alias_version
	}
}

shadowJar {
	configurations = [project.configurations.shadow]

	from jar.archiveFile

	relocate 'org.apache.commons.collections4', 'oculus.org.apache.commons.collections4'

	archiveClassifier.set "shadow"

	manifest {
		attributes(
				'Main-Class': 'net.irisshaders.iris.LaunchWarn'
		)
	}
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

jar {
	from(files('LICENSE', 'COPYING.LESSER', 'COPYING.GPL-3.0', 'NOTICE', 'licenses/irisflw-LICENSE')) { into 'META-INF/visus' }
	from sourceSets.sodiumCompatibility.output
	from sourceSets.vendored.output
	from sourceSets.desktop.output
}

java {
	withSourcesJar()
}

sourcesJar {
	from sourceSets.sodiumCompatibility.allSource
	from sourceSets.vendored.allSource
	from sourceSets.desktop.allSource
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

// ---------------------------------------------------------------------------------------------------------------------
// Visus checks (docs/VISUS-ROADMAP.md, "Test tiers")

def visusJavaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }

// T2: every member that RatPack dependents link against must still exist (abi/abi-freeze.txt, from tools/abi).
tasks.register('abiCheck', Exec) {
	group = 'verification'
	description = 'Checks the remapped jar against abi/abi-freeze.txt'
	dependsOn remapJar
	inputs.file('abi/abi-freeze.txt')
	inputs.file(remapJar.archiveFile)
	outputs.file(layout.buildDirectory.file('reports/abi-check.txt'))
	doFirst { layout.buildDirectory.dir('reports').get().asFile.mkdirs() }
	executable = visusJavaLauncher.get().executablePath.asFile
	args 'tools/abi/AbiCensus.java', 'check', 'abi/abi-freeze.txt', remapJar.archiveFile.get().asFile.absolutePath,
			layout.buildDirectory.file('reports/abi-check.txt').get().asFile.absolutePath
}

// Never ship a Sodium terrain shader override: AtmospheraLib turns off all its terrain features when any
// non-Embeddium jar contains it (docs/VISUS-ARCHITECTURE.md A§4.1).
tasks.register('checkForbiddenResources') {
	group = 'verification'
	dependsOn remapJar
	inputs.file(remapJar.archiveFile)
	doLast {
		def forbidden = ['assets/sodium/shaders/blocks/block_layer_opaque.vsh']
		zipTree(remapJar.archiveFile).visit { d ->
			if (forbidden.contains(d.relativePath.pathString)) {
				throw new GradleException("Forbidden resource in jar: ${d.relativePath.pathString}")
			}
		}
	}
}

tasks.named('check') { dependsOn 'checkForbiddenResources', 'abiCheck' }
