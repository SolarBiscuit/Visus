# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G

loom.platform = forge

# Fabric Properties
	# check these on https://fabricmc.net/develop
	minecraft_version=1.20.1
	forge_version=47.1.105

# Mod Properties
	mod_version = 0.4.0
	# Version the "oculus" alias mod reports (docs/VISUS-ARCHITECTURE.md A§4.1). Exactly 1.8.0 while Visus internals still
	# match Oculus 1.8.0, so RatOptimization's oculus_shaders module (parallel compile, transform cache) keeps working.
	# 1.8.100 since Visus 0.4.0, which absorbed that module (it now switches itself off).
	oculus_alias_version = 1.8.100
	maven_group = dev.visus
	archives_base_name = visus

# Dependencies
	embeddium_version=0.3.31-beta.53+mc1.20.1
	flywheel_version=1.0.4
