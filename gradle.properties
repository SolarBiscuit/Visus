# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G

loom.platform = forge

# Fabric Properties
	# check these on https://fabricmc.net/develop
	minecraft_version=1.20.1
	forge_version=47.1.105

# Mod Properties
	mod_version = 0.2.0
	# Version the "oculus" alias mod reports (docs/VISUS-ARCHITECTURE.md A§4.1). Exactly 1.8.0 while Visus internals still
	# match Oculus 1.8.0, so RatOptimization's oculus_shaders module (parallel compile, transform cache) keeps working.
	# Moves to 1.8.100 in 0.3.0, when Visus absorbs that module.
	oculus_alias_version = 1.8.0
	maven_group = dev.visus
	archives_base_name = visus

# Dependencies
	embeddium_version=0.3.14-git.8af1729+mc1.20.1
